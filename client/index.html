<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7efe7" />
    <title>Dashy</title>
    <script>
      // Apply the saved theme before paint to avoid a flash. Defaults to light.
      (function () {
        try {
          var t = localStorage.getItem('dashy-theme');
          var el = document.documentElement;
          if (t === 'dark') el.classList.add('dark');
          else if (t === 'violet') el.classList.add('violet');
          else if (t === 'image') el.classList.add('theme-image');
          else if (t === 'noir') {
            el.classList.add('noir');
            el.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
